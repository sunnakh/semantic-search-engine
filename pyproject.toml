[project]
name = "semantic-search-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pyarrow>=26,<27"]

[project.optional-dependencies]
dense = ["numpy>=2,<3", "sentence-transformers>=5,<6", "torch>=2.6,<3"]
qwen = ["peft>=0.20,<1"]
qwen-mlx = ["mlx-lm==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'"]
registry = ["mlflow>=3,<4"]
serving = [
    "fastapi>=0.115,<1",
    "prometheus-client>=0.20,<1",
    "pydantic>=2,<3",
    "uvicorn>=0.34,<1",
]
ui = ["pydantic>=2,<3", "streamlit>=1.50,<2"]

[dependency-groups]
dev = ["mypy==2.3.1", "ruff==0.17.6"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
files = ["src"]
explicit_package_bases = true
follow_imports = "silent"
ignore_missing_imports = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
